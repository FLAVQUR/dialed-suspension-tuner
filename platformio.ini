; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; How this machine uploads (the device's address and the OTA password) is in
; platformio.local.ini, which is not in the repository — copy
; platformio.local.ini.example to create it. Without it, uploads go over USB.
extra_configs = platformio.local.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Level 2 = errors and warnings from the Arduino core and its libraries. They
; are what says why an SD write failed (kept in memory by log_capture, read
; back at /api/debug/log); at the default level they are compiled out.
build_flags = -DCORE_DEBUG_LEVEL=2
board_build.filesystem = littlefs
; The filesystem image gets a gzipped copy of data/ (see the script).
extra_scripts = pre:tools/gzip_web_files.py
lib_deps =
	mikalhart/TinyGPSPlus
	sparkfun/SparkFun BNO08x Cortex Based IMU@^1.0.6
	SD
	fastled/FastLED@^3.10.3
	bblanchon/ArduinoJson@^7.2.1
