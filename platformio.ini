; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; How this machine uploads (the device's address and the OTA password) is in
; platformio.local.ini, which is not in the repository — copy
; platformio.local.ini.example to create it. Without it, uploads go over USB.
extra_configs = platformio.local.ini

[env:esp32dev]
; The platform and the libraries below are pinned to exact versions: a fresh
; checkout has to build the firmware that was tested, not whatever is newest.
; (FastLED 3.10.6 in place of 3.10.3 alone adds 390 KB, and the firmware no
; longer fits its partition.) Upgrade on purpose, one at a time.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Level 2 = errors and warnings from the Arduino core and its libraries. They
; are what says why an SD write failed (kept in memory by log_capture, read
; back at /api/debug/log); at the default level they are compiled out.
build_flags = -DCORE_DEBUG_LEVEL=2
board_build.filesystem = littlefs
; In this order: the version stamp (git describe + build time) first, because
; the next script puts it in the filesystem image along with a gzipped copy of
; data/. The last one makes "upload" send the dashboard after the firmware.
extra_scripts =
	pre:tools/version_stamp.py
	pre:tools/gzip_web_files.py
	post:tools/upload_both.py
lib_deps =
	mikalhart/TinyGPSPlus@1.1.0
	sparkfun/SparkFun BNO08x Cortex Based IMU@1.0.6
	SD
	fastled/FastLED@3.10.3
	bblanchon/ArduinoJson@7.4.3
